<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>CS Music — Offline & Online Music</title>
<meta name="description" content="CS Music for iPhone. Offline library, playlists, online search and streaming. Zero servers. Zero tracking.">
<meta name="theme-color" content="#04011B">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CS Music">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <header id="topbar">
    <div class="brand"><img class="brand-logo" src="logo.png" alt="CS Music" width="30" height="30" style="width:30px;height:30px;border-radius:8px;object-fit:cover;display:block;flex-shrink:0"><span class="brand-name">CS <span>Music</span></span></div>
    <div class="topbar-actions">
      <button class="icon-btn" id="btn-import" aria-label="Import music" title="Import music">
        <svg viewBox="0 0 24 24"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 17v2a2 2 0 002 2h12a2 2 0 002-2v-2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button class="icon-btn" id="btn-settings" aria-label="Settings">
        <svg viewBox="0 0 24 24"><path d="M12 15.5A3.5 3.5 0 1012 8.5a3.5 3.5 0 000 7zm7.4-2.6c.04-.3.06-.6.06-.9s-.02-.6-.07-.9l2-1.6a.5.5 0 00.12-.64l-1.9-3.3a.5.5 0 00-.6-.22l-2.4.96a7.3 7.3 0 00-1.56-.9l-.36-2.54a.5.5 0 00-.5-.42h-3.8a.5.5 0 00-.5.42l-.36 2.54c-.56.24-1.08.54-1.56.9l-2.4-.96a.5.5 0 00-.6.22l-1.9 3.3a.5.5 0 00.12.64l2 1.6c-.05.3-.07.6-.07.9s.02.6.07.9l-2 1.6a.5.5 0 00-.12.64l1.9 3.3c.13.22.4.3.6.22l2.4-.96c.48.36 1 .66 1.56.9l.36 2.54c.04.24.25.42.5.42h3.8c.25 0 .46-.18.5-.42l.36-2.54a7.3 7.3 0 001.56-.9l2.4.96c.22.08.47 0 .6-.22l1.9-3.3a.5.5 0 00-.12-.64l-2-1.6z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </header>

  <main id="screens">
    <section class="screen active" data-screen="home">
      <div class="screen-inner" id="home-content"></div>
    </section>
    <section class="screen" data-screen="search">
      <div class="screen-inner" id="search-content"></div>
    </section>
    <section class="screen" data-screen="library">
      <div class="screen-inner" id="library-content"></div>
    </section>
    <section class="screen" data-screen="playlists">
      <div class="screen-inner" id="playlists-content"></div>
    </section>
  </main>

  <div id="mini-player" hidden>
    <div class="mini-progress" id="mini-progress"></div>
    <div class="mini-art" id="mini-art"></div>
    <div class="mini-meta" id="mini-meta">
      <div class="mini-title" id="mini-title">—</div>
      <div class="mini-artist" id="mini-artist"></div>
    </div>
    <button class="icon-btn" id="mini-toggle" aria-label="Play/Pause"></button>
    <button class="icon-btn" id="mini-next" aria-label="Next">
      <svg viewBox="0 0 24 24"><path d="M6 5l9 7-9 7V5zm11 0h2v14h-2V5z" fill="currentColor"/></svg>
    </button>
  </div>

  <nav id="tabbar">
    <button class="tab active" data-tab="home">
      <svg viewBox="0 0 24 24"><path d="M4 10.5L12 4l8 6.5V20a1 1 0 01-1 1h-5v-6h-4v6H5a1 1 0 01-1-1v-9.5z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
      <span>Home</span>
    </button>
    <button class="tab" data-tab="search">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M16 16l4.5 4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <span>Search</span>
    </button>
    <button class="tab" data-tab="library">
      <svg viewBox="0 0 24 24"><path d="M4 5v14M8.5 5v14M13 6l5.5-1.5v13L13 19V6z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>Library</span>
    </button>
    <button class="tab" data-tab="playlists">
      <svg viewBox="0 0 24 24"><path d="M4 6h12M4 10h12M4 14h7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M17 12v7.2a2.4 2.4 0 10 1.6 2.3V13.5l3-.8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>Playlists</span>
    </button>
  </nav>
</div>

<div id="now-playing" class="closed" aria-hidden="true">
  <div class="np-bg" id="np-bg"></div>
  <div class="np-inner">
    <div class="np-handle" id="np-handle">
      <button class="icon-btn" id="np-close" aria-label="Close">
        <svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <span class="np-label" id="np-source-label">NOW PLAYING</span>
      <button class="icon-btn" id="np-queue-btn" aria-label="Queue">
        <svg viewBox="0 0 24 24"><path d="M4 6h12M4 10h12M4 14h7M17 12v7.2a2.4 2.4 0 101.6 2.3V13.5l3-.8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
    <div class="np-art-wrap">
      <div class="np-art" id="np-art"></div>
      <div class="np-eq" id="np-eq" hidden><i></i><i></i><i></i><i></i><i></i></div>
    </div>
    <div class="np-meta">
      <div class="np-title" id="np-title">—</div>
      <div class="np-artist" id="np-artist"></div>
    </div>
    <div class="np-seek">
      <input type="range" id="seek" min="0" max="1000" value="0" step="1" aria-label="Seek">
      <div class="np-times"><span id="t-cur">0:00</span><span id="t-dur">0:00</span></div>
    </div>
    <div class="np-controls">
      <button class="icon-btn np-sm" id="btn-shuffle" aria-label="Shuffle">
        <svg viewBox="0 0 24 24"><path d="M16 4l4 3-4 3M16 14l4 3-4 3M4 7h3.5c1.2 0 2.3.6 3 1.6l3 4.8c.7 1 1.8 1.6 3 1.6H20M4 17h3.5c.7 0 1.3-.2 1.8-.6M20 7h-2.7c-1.2 0-2.3.6-3 1.6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button class="icon-btn" id="btn-prev" aria-label="Previous">
        <svg viewBox="0 0 24 24"><path d="M18 5v14L8 12l10-7zM6 5h2v14H6V5z" fill="currentColor"/></svg>
      </button>
      <button class="play-big" id="btn-play" aria-label="Play/Pause"></button>
      <button class="icon-btn" id="btn-next" aria-label="Next">
        <svg viewBox="0 0 24 24"><path d="M6 5l10 7-10 7V5zm10 0h2v14h-2V5z" fill="currentColor"/></svg>
      </button>
      <button class="icon-btn np-sm" id="btn-repeat" aria-label="Repeat">
        <svg viewBox="0 0 24 24"><path d="M17 3l3 3-3 3M20 6H8a4 4 0 00-4 4v1M7 21l-3-3 3-3M4 18h12a4 4 0 004-4v-1" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
    <div class="np-extra">
      <button class="pill-btn" id="btn-save-offline">Save offline</button>
      <button class="pill-btn" id="btn-add-playlist">Add to playlist</button>
    </div>
  </div>
</div>

<div id="sheet-host" hidden>
  <div class="sheet-scrim" id="sheet-scrim"></div>
  <div class="sheet" id="sheet">
    <div class="sheet-grip"></div>
    <div class="sheet-title" id="sheet-title"></div>
    <div class="sheet-body" id="sheet-body"></div>
  </div>
</div>

<div id="dialog-host" hidden>
  <div class="sheet-scrim" id="dialog-scrim"></div>
  <div class="dialog" id="dialog">
    <div class="dialog-title" id="dialog-title"></div>
    <div class="dialog-msg" id="dialog-msg"></div>
    <input type="text" id="dialog-input" hidden>
    <div class="dialog-actions" id="dialog-actions"></div>
  </div>
</div>

<div id="toast" hidden></div>
<div id="dropzone" hidden><div>Drop music files here</div></div>

<audio id="media" playsinline preload="auto"></audio>
<input type="file" id="import-input" multiple accept="audio/*,.mp3,.m4a,.aac,.flac,.wav,.ogg,.opus,.webm,.mp4" hidden>

<script type="module" src="js/app.js"></script>
</body>
</html>
